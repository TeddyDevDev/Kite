# Compila Kite.exe en Windows y lo publica en Releases.
# Se lanza al subir una etiqueta vX.Y.Z (o a mano desde la pestaña Actions).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release --locked

      - name: Preparar Kite.exe
        shell: pwsh
        run: Copy-Item target/release/kite.exe Kite.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Kite.exe
          generate_release_notes: true

      - name: Guardar como artefacto (ejecuciones manuales)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Kite
          path: Kite.exe
