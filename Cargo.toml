[package]
name = "kite"
version = "0.12.0"
edition = "2021"
default-run = "kite"
autobins = false
description = "Ayudante ligero para League of Legends: solo APIs oficiales, sin anuncios ni telemetría"

[dependencies]
# Interfaz: renderizado por software (sin GPU ni navegador) = mínima RAM y redibuja solo cuando algo cambia
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
# WebSocket de la LCU (eventos en vez de sondeo = 0% CPU en reposo)
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
base64 = "0.22"
# Internet SOLO para Data Dragon (iconos y nombres) y OP.GG (builds y counters)
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Decodificar iconos de objetos sin arrastrar librerías de imagen pesadas
png = "0.18"
# Arte del campeón (el cliente lo da en JPG)
jpeg-decoder = { version = "0.3", default-features = false }

[lib]
name = "kite"
path = "src/lib.rs"

[[bin]]
name = "kite"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.19"

# Icono del .exe (solo al compilar en Windows)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
